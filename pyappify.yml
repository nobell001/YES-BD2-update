name: "yes-bd2"
uac: true
icon: "icons/icon.png"
profiles:
  # One installer for everyone (Leo 2026-10-08): the China/Global split only
  # chose the update source, and every install now updates from GitHub.
  - name: "Full"
    git_url: "https://github.com/nobell001/YES-BD2-update.git"
    admin: true
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    pip_args: "--no-deps"
    use_pythonw: true
    show_add_defender: true
